<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolSurvivor demo</title>
<meta name="description" content="A 30-second demo of SolSurvivor, a Mars and Moon base game for kids aged 7 to 12, made for NASA Space Apps 2026.">
<style>
  :root { color-scheme: dark; --bg: #1a0f0b; --text: #fff4ea; --muted: #d9bfa8; --amber: #ffb36b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #5a2a17, var(--bg) 70%); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: clamp(1.6rem, 4vw, 2.4rem); }
  h1 span { color: var(--amber); }
  p { margin: 0 0 20px; color: var(--muted); }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; box-shadow: 0 16px 50px #0009; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
  a { color: var(--text); }
  a.button { display: inline-block; padding: 12px 22px; border-radius: 999px; background: linear-gradient(#ffb36b, #f08a4b); color: #2a1208; font-weight: 800; text-decoration: none; }
  a.plain { display: inline-block; padding: 12px 6px; }
  h2 { margin: 36px 0 10px; font-size: 1.1rem; }
</style>
</head>
<body>
<main>
  <h1><span>Sol</span>Survivor: 30-second demo</h1>
  <p>Kids aged 7 to 12 keep a Mars or Moon base alive with real NASA data. NASA Space Apps 2026, “Build a Junior Astronaut Mission Trainer”.</p>
  <video src="solsurvivor-demo.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  <div class="links">
    <a class="button" href="../">Play the game</a>
    <a class="plain" href="https://github.com/Tarekkharsa/solsurvivor">Source code on GitHub</a>
    <a class="plain" href="solsurvivor-demo.mp4" download>Download the video</a>
  </div>
  <h2 lang="ar" dir="rtl">النسخة العربية · Arabic version</h2>
  <video src="solsurvivor-demo-ar.mp4" poster="poster-ar.jpg" controls playsinline preload="none" lang="ar"></video>
</main>
</body>
</html>
